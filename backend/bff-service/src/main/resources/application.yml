server:
  port: 8000

spring:
  application:
    name: bff-service

# ── Downstream service URLs ─────────────────────────────────────────────
# Override these via environment variables in Docker / Kubernetes
services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8001}
  salary-submission:
    url: ${SALARY_SUBMISSION_SERVICE_URL:http://localhost:8002}
  search:
    url: ${SEARCH_SERVICE_URL:http://localhost:8003}
  stats:
    url: ${STATS_SERVICE_URL:http://localhost:8004}
  vote:
    url: ${VOTE_SERVICE_URL:http://localhost:8005}

# ── CORS allowed origins (comma-separated list) ─────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ── HTTP client timeouts (ms) ───────────────────────────────────────────
http-client:
  connect-timeout: 5000
  read-timeout: 10000

# ── Actuator endpoints ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # exposes /actuator/health/liveness and /readiness
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    lk.watupa.bff: DEBUG
    org.springframework.web: INFO
