spring.application.name=vote-service
server.port=8005

# Mark submission as APPROVED when total votes (upvotes + downvotes) reaches this threshold.
vote.approval.threshold=2

# Downstream service URLs
services.salary-submission.url=${SALARY_SUBMISSION_SERVICE_URL:http://localhost:8002}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
