spring.application.name=vote-service
server.port=8085

# Mark submission as APPROVED when total votes (upvotes + downvotes) reaches this threshold.
vote.approval.threshold=2

#  Downstream service URLs
services.salary-submission.url=${SALARY_SUBMISSION_SERVICE_URL:http://localhost:8082}

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:votedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true
