# Tests rely on schema.sql so the explicit community schema is present.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
vote.approval.threshold=2

# Downstream service URL (mocked in tests)
services.salary-submission.url=http://localhost:9999

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
