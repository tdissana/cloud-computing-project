apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: watupa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: watupa/frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://bff-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: watupa-app
spec:
  selector:
    app: frontend
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: watupa-app
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: watupa.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
