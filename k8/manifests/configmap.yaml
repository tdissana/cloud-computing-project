apiVersion: v1
kind: ConfigMap
metadata:
  name: watupa-config
  namespace: watupa-app
data:
  DB_HOST: "postgres.watupa-data.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "watupa"
  DB_USERNAME: "watupa"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: watupa-data-config
  namespace: watupa-data
data:
  DB_HOST: "postgres.watupa-data.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "watupa"
  DB_USERNAME: "watupa"
  # Password in Secret
