apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  namespace: watupa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      containers:
      - name: bff-service
        image: watupa/bff-service:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: watupa-config
        - secretRef:
            name: watupa-secret
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: watupa
spec:
  selector:
    app: bff-service
  ports:
  - port: 8000
    targetPort: 8000
