apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-service
  namespace: watupa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-service
  template:
    metadata:
      labels:
        app: vote-service
    spec:
      containers:
      - name: vote-service
        image: watupa/vote-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8005
        envFrom:
        - configMapRef:
            name: watupa-config
        - secretRef:
            name: watupa-secret
---
apiVersion: v1
kind: Service
metadata:
  name: vote-service
  namespace: watupa-app
spec:
  selector:
    app: vote-service
  ports:
  - port: 8005
    targetPort: 8005
