name: Frontend CI                # Workflow name shown in GitHub Actions

on:                              # Defines when the workflow runs
  push:                          # Run when code is pushed
    branches: [ "main", "development" ]   # Only for these branches
    paths:                       # Only run if these paths change
      - "frontend/**"            # Any file inside frontend folder
      - ".github/workflows/frontend-ci.yml" # Workflow file itself

  pull_request:                  # Run for pull requests
    branches: [ "main", "development" ]   # PR target branches

  workflow_dispatch:             # Allow manual execution from GitHub UI

jobs:                            # Contains all workflow jobs
  build:                         # Job name

    runs-on: ubuntu-latest       # Use Ubuntu virtual machine

    defaults:                    # Default settings
      run:
        working-directory: frontend   # Run commands inside frontend folder

    steps:                       # Steps executed in order

      - name: Checkout code      # Step name
        uses: actions/checkout@v4   # Download repository code

      - name: Setup Node.js      # Install Node.js
        uses: actions/setup-node@v4
        with:                    # Configuration values
          node-version: 20       # Install Node.js version 20
          cache: 'npm'           # Enable npm dependency caching
          cache-dependency-path: frontend/package-lock.json
          # File used to detect dependency changes

      - name: Install dependencies # Install frontend packages
        run: npm ci              # Clean install from package-lock.json

      - name: Run TypeScript check # Check TypeScript errors
        run: npx tsc --noEmit    # Compile check without generating files

      - name: Run ESLint         # Run code quality checks
        run: npm run lint

      - name: Build Next.js app  # Build production frontend app
        run: npm run build
