name: Backend CI                 # Workflow name shown in GitHub Actions

on:                              # Defines when the workflow runs
  push:                          # Run when code is pushed
    branches: [ "main", "development" ]   # Only for these branches
    paths:                       # Only run if these paths change
      - "services/**"            # Any file inside services folder
      - ".github/workflows/backend-ci.yml" # Workflow file itself

  pull_request:                  # Run for pull requests
    branches: [ "main", "development" ]   # PR target branches

  workflow_dispatch:             # Allow manual execution from GitHub UI

jobs:                            # Contains all workflow jobs
  build:                         # Job name

    runs-on: ubuntu-latest       # Use Ubuntu virtual machine

    defaults:                    # Default settings
      run:
        working-directory: backend   # Run commands inside backend folder

    steps:                       # Steps executed in order

      - name: Checkout code      # Step name
        uses: actions/checkout@v4   # Download repository code

      - name: Set up JDK 21      # Install Java 21
        uses: actions/setup-java@v4
        with:                    # Configuration values
          distribution: 'temurin'   # Java distribution
          java-version: '21'        # Java version

      - name: Cache Maven dependencies   # Save Maven packages for faster builds
        uses: actions/cache@v4
        with:
          path: ~/.m2            # Maven dependency folder
          key: maven-${{ runner.os }}-${{ hashFiles('services/pom.xml') }}
          # Unique cache key
          restore-keys: |        # Fallback cache key
            maven-${{ runner.os }}

      - name: Build all services # Build backend applications
        run: mvn clean install -DskipTests=false
        # Run Maven build with tests enabled

      - name: Upload JAR artifacts # Upload generated JAR files
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars     # Artifact name
          path: services/**/target/*.jar
          # Path to generated JAR files