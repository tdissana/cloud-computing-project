apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watupa-ingress
  namespace: app
  annotations:
    # Traefik is k3s's built-in ingress controller
    kubernetes.io/ingress.class: "traefik"
    # Strip /api prefix before forwarding to BFF
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  rules:
    - http:
        paths:
          # ── All API calls go to BFF ───────────────────────────────────
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bff-svc
                port:
                  number: 8080

          # ── Everything else goes to Next.js frontend ──────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 3000
