apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: app
data:
  # ── Internal service URLs (ClusterIP DNS) ─────────────────────────
  IDENTITY_SERVICE_URL:          "http://identity-svc:8081"
  SALARY_SUBMISSION_SERVICE_URL: "http://salary-submission-svc:8082"
  VOTE_SERVICE_URL:              "http://vote-svc:8083"
  SEARCH_SERVICE_URL:            "http://search-svc:8084"
  STATS_SERVICE_URL:             "http://stats-svc:8085"

  # ── Shared Spring datasource config ───────────────────────────────
  SPRING_JPA_HIBERNATE_DDL_AUTO:   "validate"
  SPRING_JPA_SHOW_SQL:             "false"
  SPRING_DATASOURCE_DRIVER:        "org.postgresql.Driver"

  # ── Vote approval threshold ────────────────────────────────────────
  VOTE_APPROVAL_THRESHOLD: "3"

  # ── CORS allowed origins (Traefik will be the external entry point) ─
  CORS_ALLOWED_ORIGINS: "*"

  # ── Actuator (health probes) ───────────────────────────────────────
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:   "always"
