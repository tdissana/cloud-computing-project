apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: app
data:
  # Internal service URLs (ClusterIP DNS names)
  IDENTITY_SERVICE_URL:          "http://identity-service:8001"
  SALARY_SUBMISSION_SERVICE_URL: "http://salary-submission-service:8002"
  SEARCH_SERVICE_URL:            "http://search-service:8003"
  STATS_SERVICE_URL:             "http://stats-service:8004"
  VOTE_SERVICE_URL:              "http://vote-service:8005"

  # CORS — allow frontend to reach BFF
  # Update this to your minikube IP after running: minikube ip
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://127.0.0.1"

  # Vote approval threshold
  VOTE_APPROVAL_THRESHOLD: "2"
